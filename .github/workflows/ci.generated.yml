# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    name: '${{ matrix.config.kind }} ${{ matrix.config.os }}'
    runs-on: '${{ matrix.config.os }}'
    permissions:
      contents: read
    strategy:
      matrix:
        config:
          - os: ubuntu-latest
            kind: test_release
          - os: ubuntu-latest
            kind: test_debug
    env:
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - name: Install wasm32 target
        if: matrix.config.kind == 'test_release'
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: '${{ github.ref == ''refs/heads/main'' }}'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install npm dependencies
        run: npm ci
      - name: Build JS bundle
        run: node scripts/build_bundle.js
      - name: Format check
        if: matrix.config.kind == 'test_debug'
        run: cargo fmt --all -- --check
      - name: Build debug
        if: matrix.config.kind == 'test_debug'
        run: cargo build --locked
      - name: Build release
        if: matrix.config.kind == 'test_release'
        run: cargo build --locked --target wasm32-unknown-unknown --features wasm --release
      - name: Test debug
        if: matrix.config.kind == 'test_debug'
        run: cargo test --locked
      - name: Test release
        if: matrix.config.kind == 'test_release'
        run: cargo test --locked --release
      - name: Clippy
        if: matrix.config.kind == 'test_debug'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Get tag version
        id: get_tag_version
        if: 'matrix.config.kind == ''test_release'' && startsWith(github.ref, ''refs/tags/'') && github.repository == ''apcamargo/dprint-plugin-bibtex-tidy'''
        run: 'echo "TAG_VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"'
      - name: Pre-release
        if: 'matrix.config.kind == ''test_release'' && startsWith(github.ref, ''refs/tags/'') && github.repository == ''apcamargo/dprint-plugin-bibtex-tidy'''
        run: |-
          # stamp the release version into the schema $id
          sed -i 's|/apcamargo/bibtex-tidy/0.0.0/schema.json|/apcamargo/bibtex-tidy/'"${{ steps.get_tag_version.outputs.TAG_VERSION }}"'/schema.json|' deployment/schema.json
          # rename the wasm file
          (cd target/wasm32-unknown-unknown/release/ && mv dprint_plugin_bibtex_tidy.wasm plugin.wasm)
          # create release notes
          deno run -A --frozen ./scripts/generate_release_notes.ts ${{ steps.get_tag_version.outputs.TAG_VERSION }} > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        if: 'matrix.config.kind == ''test_release'' && startsWith(github.ref, ''refs/tags/'') && github.repository == ''apcamargo/dprint-plugin-bibtex-tidy'''
        env:
          GITHUB_TOKEN: '${{ secrets.GH_WORKFLOW_TOKEN }}'
        with:
          files: |-
            target/wasm32-unknown-unknown/release/plugin.wasm
            deployment/schema.json
          body_path: '${{ github.workspace }}-CHANGELOG.txt'
          draft: false
      - name: Lint workflow generation
        if: matrix.config.kind == 'test_debug'
        run: |-
          deno run -A --frozen ./.github/workflows/ci.ts --lint
          deno run -A --frozen ./.github/workflows/release.ts --lint
          deno run -A --frozen ./.github/workflows/check_updates.ts --lint
