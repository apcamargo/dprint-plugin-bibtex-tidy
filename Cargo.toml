[package]
name = "dprint-plugin-bibtex-tidy"
version = "0.1.0"
authors = ["Antonio Camargo <antoniop.camargo@gmail.com>"]
edition = "2024"
homepage = "https://github.com/apcamargo/dprint-plugin-bibtex-tidy"
keywords = ["bib", "bibtex", "bibtex-tidy", "formatter", "formatting"]
license = "MIT"
repository = "https://github.com/apcamargo/dprint-plugin-bibtex-tidy"
description = "BibTeX formatter for dprint via bibtex-tidy."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
boa_engine = { version = "0.21.1", default-features = false }
dprint-core = { version = "0.69.1", default-features = false }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
dprint-development = "0.11.0"
jsonschema = { version = "0.30", default-features = false }
pretty_assertions = "1.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"

[features]
wasm = ["dprint-core/wasm"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
